version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
    working_dir: /workspace/frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
    networks:
      - gh300-network

  # Backend service (optional, for future use)
  # backend:
  #   build:
  #     context: ./backend
  #   volumes:
  #     - ./backend:/app
  #   ports:
  #     - "8000:8000"
  #   command: uvicorn main:app --reload --host 0.0.0.0
  #   networks:
  #     - gh300-network

networks:
  gh300-network:
    driver: bridge
